{% extends 'partials/base.html' %}
{% load static django_vite %}
{% block content %}

<div id="react-vendor-list-page" data-count="{{ vendedores.count }}" data-vendedores='[
            {% for v in vendedores %}
            {
                "vid": "{{ v.vid|escapejs }}",
                "titulo": "{{ v.titulo|escapejs }}",
                "imagem": "{% if v.imagem %}{{ v.imagem.url|escapejs }}{% endif %}",
                "quantidade_produtos": "{{ v.produto.all.count|escapejs }}",
                "data_ano": "{{ v.data|date:' Y'|escapejs }}", "endereco" : "{{ v.endereco|escapejs }}" , "contato"
    : "{{ v.contato|escapejs }}" }{% if not forloop.last %},{% endif %} {% endfor %} ]'></div>

{% vite_hmr_client %}
{% vite_asset 'src/vendor_list.jsx' %}

{% endblock content %}
