{% extends 'partials/base.html' %}
{% load static django_vite %}
{% block content %}

<div id="react-vendor-detail-page" data-count="{{ produtos.count }}" data-vendedor='{
            "vid": "{{ vendedor.vid|escapejs }}",
            "titulo": "{{ vendedor.titulo|escapejs }}",
            "imagem": "{% if vendedor.imagem %}{{ vendedor.imagem.url|escapejs }}{% endif %}",
            "capa_imagem": "{% if vendedor.capa_imagem %}{{ vendedor.capa_imagem.url|escapejs }}{% endif %}",
            "descricao": "{{ vendedor.descricao|truncatechars:200|escapejs }}",
            "data_ano": "{{ vendedor.data|date:"Y"|escapejs }}",
            "endereco": "{{ vendedor.endereco|escapejs }}",
            "contato": "{{ vendedor.contato|escapejs }}"
        }' data-produtos='[
            {% for p in produtos %}
            {
                "id": "{{ p.id|escapejs }}",
                "pid": "{{ p.pid|escapejs }}",
                "titulo": "{{ p.titulo|escapejs }}",
                "imagem": "{% if p.imagem %}{{ p.imagem.url|escapejs }}{% endif %}",
                "categoria_titulo": "{{ p.categoria.titulo|escapejs }}",
                "media_avaliacoes": "{{ p.media_avaliacoes|escapejs }}",
                "preco": "{{ p.preco|escapejs }}",
                "preco_antigo": "{{ p.preco_antigo|escapejs }}",
                "obter_porcentagem": "{{ p.obter_porcentagem|escapejs }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ]' data-categorias='[
            {% for c in categorias %}
            {
                "titulo": "{{ c.titulo|escapejs }}",
                "imagem": "{% if c.imagem %}{{ c.imagem.url|escapejs }}{% endif %}",
                "count": "{{ c.categorias.all.count|escapejs }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ]'></div>

{% vite_hmr_client %}
{% vite_asset 'src/vendor_detail.jsx' %}

{% endblock content %}
