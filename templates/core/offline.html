<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - OrganyxHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #3bb77e 0%, #2a9d5f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .offline-container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .offline-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .offline-message {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .features-list {
            margin-top: 2rem;
            text-align: left;
        }
        
        .features-list h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        
        .features-list ul {
            list-style: none;
        }
        
        .features-list li {
            padding: 0.5rem 0;
            opacity: 0.8;
        }
        
        .features-list li:before {
            content: "🌱 ";
            margin-right: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .offline-title {
                font-size: 2rem;
            }
            
            .offline-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">🌐</div>
        <h1 class="offline-title">Você está offline</h1>
        <p class="offline-message">
            Parece que você perdeu a conexão com a internet. Não se preocupe, 
            algumas funcionalidades ainda estão disponíveis!
        </p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            Tentar novamente
        </button>
        
        <div class="features-list">
            <h3>Disponível offline:</h3>
            <ul>
                <li>Visualizar produtos em cache</li>
                <li>Navegar pelo catálogo</li>
                <li>Ver informações da conta</li>
                <li>Acessar páginas visitadas recentemente</li>
            </ul>
        </div>
    </div>

    <script>
        // Check for network connectivity
        function checkOnlineStatus() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }

        // Listen for online event
        window.addEventListener('online', checkOnlineStatus);

        // Periodic check every 5 seconds
        setInterval(checkOnlineStatus, 5000);

        // Service worker registration check
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(registration => {
                console.log('Service Worker is ready');
            });
        }
    </script>
</body>
</html>
