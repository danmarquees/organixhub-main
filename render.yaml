databases:
  - name: organixhub-db
    databaseName: organixhub
    user: organixhub
    plan: free

services:
  - type: web
    name: organixhub
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn marketplace.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: organixhub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
